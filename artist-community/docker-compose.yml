services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: artist_community
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - artist_community_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d artist_community"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  artist_community_pg:
