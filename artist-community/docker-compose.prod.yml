services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: artist_community
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d artist_community"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters are ephemeral. No public Redis port and no key eviction.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: artist-community/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ARTIST_COMMUNITY_HOST: 0.0.0.0
      ARTIST_COMMUNITY_TRUST_PROXY: 'true'
      ARTIST_COMMUNITY_PORT: 3100
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:?Set MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      ARTIST_COMMUNITY_ADMIN_TOKEN: ${ARTIST_COMMUNITY_ADMIN_TOKEN:?Set ARTIST_COMMUNITY_ADMIN_TOKEN}
      ARTIST_COMMUNITY_REVIEWER_TOKEN: ${ARTIST_COMMUNITY_REVIEWER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, public]
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      ADMIN_BASIC_USER: ${ADMIN_BASIC_USER:?Set ADMIN_BASIC_USER}
      ADMIN_BASIC_HASH: ${ADMIN_BASIC_HASH:?Set ADMIN_BASIC_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [public]

networks:
  internal:
    internal: true
  public:

volumes:
  db_data:
  caddy_data:
  caddy_config:
