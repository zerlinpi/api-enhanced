name: Review Upstream Updates (Fork)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Never merge upstream directly into fork main.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'zerlinpi/api-enhanced' && github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout our main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch official upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced.git
          git fetch upstream main
          git fetch origin main

      - name: Merge upstream into a proposal branch only
        id: prepare
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Fork main already includes the current upstream main.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create upstream-proposal --track origin/main
          if ! git merge --no-ff --no-edit upstream/main; then
            git merge --abort || true
            echo 'Upstream has merge conflicts with customized fork code.' >&2
            echo 'Resolve conflicts manually in a separate branch; fork main has NOT been modified.' >&2
            exit 1
          fi
          echo 'needed=true' >> "$GITHUB_OUTPUT"

      - name: Publish the proposal branch, not main
        if: steps.prepare.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:refs/heads/sync/upstream-proposal

      - name: Open or update pull request for manual review
        if: steps.prepare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head sync/upstream-proposal --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing upstream review PR #$existing"
          else
            gh pr create --base main --head sync/upstream-proposal \
              --title 'chore: review changes from upstream API' \
              --body 'This PR proposes merging upstream API changes into the custom fork. Review conflicts, dependencies, security-sensitive workflows, release targets, and changes to artist-community before merging. **No direct automatic sync to main is performed.**'
          fi

      - name: Review reminder
        if: steps.prepare.outputs.needed == 'true'
        run: |
          echo 'Review proposed changes and run normal checks before a manual merge.'
          echo 'If GITHUB_TOKEN cannot create pull requests, enable the repository Actions PR setting or open a PR manually from sync/upstream-proposal.'
